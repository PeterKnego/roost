# Builds the .deb and .rpm from the binaries the release already produced —
# never from a fresh compile. A package built separately would contain
# different bytes from the tarball of the same version.
name: Build Linux packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  build-linux-packages:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: dist-in/
          merge-multiple: true

      - name: Build packages from the released binaries
        # The plan is handed over as an environment variable, never expanded
        # into the script. `${{ inputs.plan }}` inside a `run:` is substituted
        # before bash parses the line, so the JSON's own bytes become shell
        # syntax — and the plan carries the whole changelog. On v0.6.0-rc.1
        # (run 34993476520) the apostrophe in "Claude's menus" closed the
        # single-quoted string, and every backticked term after it ran as a
        # command substitution: `nosniff: command not found`, and
        # `cargo install --git` invoked with no URL. It had never fired before
        # only because there was no RELEASES.md, so the plan had no prose in
        # it. An environment variable is opaque to the parser whatever the
        # notes contain; release.yml's own publish job passes PLAN the same way.
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.releases[0].app_version' <<<"$PLAN")

          for pair in "x86_64-unknown-linux-musl amd64 x86_64" \
                      "aarch64-unknown-linux-musl arm64 aarch64"; do
            set -- $pair
            triple=$1; debarch=$2; rpmarch=$3
            tar -xJf "dist-in/roost-${triple}.tar.xz" -C dist-in
            bin="dist-in/roost-${triple}/roost"
            scripts/package-deb.sh "$bin" "$VERSION" "$debarch"
            scripts/package-rpm.sh "$bin" "$VERSION" "$rpmarch"
          done

          ls -la target/distrib/

      # This repo's generated release.yml (dist's output) uploads every
      # artifact with actions/upload-artifact@v7 and downloads with
      # actions/download-artifact@v8; those two versions interoperate, v4
      # does not (upload-artifact v4's zip layout is not what a v8 download
      # expects, and the artifact silently fails to materialize rather than
      # erroring). So this has to track whatever version release.yml uploads
      # with, not a fixed version chosen here — if a future `dist` bump
      # changes release.yml's upload-artifact version, this must move with it.
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-linux-packages
          path: |
            target/distrib/*.deb
            target/distrib/*.rpm
