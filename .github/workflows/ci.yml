name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  test:
    name: cargo test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # dtach is a runtime prerequisite, and one integration test deliberately
      # runs the real thing rather than the ROOST_CMD substitute, because the
      # substitute once hid a missing socket directory from a green suite.
      - name: Install dtach
        run: sudo apt-get update -q && sudo apt-get install -y -q dtach

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      # Single-threaded on purpose. The suite shares one process-wide session
      # registry and environment, and a bare `cargo test` has hung on it.
      - name: Test
        run: cargo test --locked -- --test-threads=1
        env:
          RUST_BACKTRACE: 1

  scripts:
    name: shellcheck + package tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # rpm is not on ubuntu runners by default; dpkg-deb is.
      - name: Install packaging tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck rpm cpio

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Swatinem/rust-cache above already restores ~/.cargo/bin by default, so
      # by the time this step runs, a run predating a version bump may have
      # already put the OLD cargo-deb/cargo-generate-rpm binaries back — this
      # was observed in job logs on real runs, including one from before this
      # cache step existed. This step is kept anyway: it names the two
      # versions explicitly rather than relying on rust-cache's implicit
      # behavior, and it survives rust-cache's own cache being evicted (10 GB
      # cap, staleness pruning) or its defaults changing.
      - name: Cache cargo-deb and cargo-generate-rpm
        id: cache-pkg-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-deb
            ~/.cargo/bin/cargo-generate-rpm
          key: pkg-tools-${{ runner.os }}-cargo-deb-3.8.0-generate-rpm-0.21.0

      # --force is required even though this only runs on a miss of the key
      # above: rust-cache may have already restored an old binary into
      # ~/.cargo/bin, and without --force `cargo install` silently no-ops on
      # an already-present binary regardless of version. The `if` guard means
      # --force costs nothing on a hit; on a miss it is the difference between
      # installing the version the key names and silently keeping whatever
      # rust-cache happened to restore.
      - name: Install cargo-deb and cargo-generate-rpm
        if: steps.cache-pkg-tools.outputs.cache-hit != 'true'
        run: cargo install cargo-deb cargo-generate-rpm --locked --force

      # None of this bash is reachable by `cargo test`, and a quoting bug in a
      # release script surfaces at the worst possible moment.
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/test/*.sh

      - name: Package tests
        run: scripts/test/packages.sh

      # `cargo publish --dry-run` needs no credential and builds the crate from
      # the PACKAGED tree rather than the working tree — the only thing that
      # catches Cargo.toml's `include` list drifting away from what build.rs
      # needs. On every push, rather than only on a release nobody can take back.
      - name: Verify the crate packages
        run: cargo publish --locked --dry-run

      # Runners have docker and the musl target is a rustup add away.
      - name: Install the musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Package install tests
        run: scripts/test/install.sh
