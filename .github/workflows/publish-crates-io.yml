# dist has no built-in crates.io job — its PublishStyle enum is Homebrew, Npm
# and User(String) only — so this is a custom publish-jobs entry.
#
# No API token. crates.io Trusted Publishing exchanges GitHub's OIDC identity
# for a 30-minute credential that its own post-step revokes, so nothing
# long-lived is stored and there is no secret to mangle on the way in — which
# is exactly how the v0.5.1 formula push failed (`Bad credentials`, a 401 on a
# secret whose value was not a valid token).
#
# The trusted publisher on crates.io must be registered against this
# top-level workflow's filename (release.yml), not this reusable file's own
# name. crates.io matches the OIDC `workflow_ref` claim — its `GitHubClaims`
# struct carries `workflow_ref` and has no `job_workflow_ref` — and GitHub
# sets `workflow_ref` to the top-level workflow, not the reusable one that
# actually runs. Registering `publish-crates-io.yml` is the intuitive choice
# and it is rejected at exchange time.
#
# This job runs only for real releases: dist's generated caller in release.yml
# gates every publish job (this one included) on
# `!announcement_is_prerelease || publish_prereleases`, and publish_prereleases
# is unset, so a prerelease tag skips this job entirely rather than reaching
# any code inside it — confirmed in production, publish-homebrew-formula
# (which carries the identical gate) reported "skipped" on v0.5.1-rc.1. There
# used to be an in-job prerelease/dry-run branch here; it was dead code (the
# caller gate meant it could never execute) and, worse, its own
# `[ "$(jq ...)" = "true" ]` comparison failed open toward a real publish on
# any jq error or renamed field, which is backwards for an action that can
# never be undone. Deleting the branch removes both problems at once. The
# dry run itself still runs, just somewhere it actually executes: as a
# `cargo publish --locked --dry-run` step in the `scripts` job of ci.yml, on
# every push instead of only on a prerelease tag nobody was cutting.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crates-io:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # dist grants custom publish jobs id-token: write by default; stated here
      # so the job cannot silently lose it if those defaults change.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish --locked --token '${{ steps.auth.outputs.token }}'
