[package]
name = "resh"
version = "0.2.0"
edition = "2021"
# Explicit, because `include_bytes!` failing on a published crate would be
# discovered from a user's bug report rather than from our own build. static/
# is not gitignored so it packages by default today; this stops that being an
# accident.
include = ["src/**/*", "static/**/*", "build.rs", "Cargo.toml", "README.md", "docs/deploy.md"]

[dependencies]
tungstenite = "0.24"
portable-pty = "0.8"
pulldown-cmark = "0.13"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"

[dev-dependencies]
ureq = "2"
tempfile = "3"

[profile.release]
strip = true
