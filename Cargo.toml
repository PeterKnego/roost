[package]
name = "roost"
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Peter Knego <peter@knego.net>"]
description = "A per-project remote workspace in one binary: browser IDE layout over real terminals that survive the tab, built for AI-assisted development"
repository = "https://github.com/PeterKnego/roost"
homepage = "https://github.com/PeterKnego/roost"
readme = "README.md"
keywords = ["terminal", "workspace", "remote", "ide", "claude"]
categories = ["development-tools", "command-line-utilities"]
# Explicit, because `include_bytes!` failing on a published crate would be
# discovered from a user's bug report rather than from our own build. static/
# is not gitignored so it packages by default today; this stops that being an
# accident. `tests/` is deliberately left out — `cargo test` is not expected
# to work against a `cargo install`-fetched source tree, and `cargo package`
# already warns about the omission.
include = [
    "src/**/*",
    "static/**/*",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "CLAUDE.md",
    "SECURITY.md",
    "docs/deploy.md",
    "docs/notifications.md",
]

[dependencies]
tungstenite = "0.24"
portable-pty = "0.8"
pulldown-cmark = "0.13"
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
notify = "8.2"
multer = "3.1"
futures-executor = "0.3"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
# Promoted from a dev-dependency: the version check is the one thing roost does
# that reaches the network. `proxy-from-env` is off in ureq's default feature
# set, so a default build ignores HTTPS_PROXY entirely — and an office behind
# one NAT, where a proxy is mandatory, is exactly where this check was designed
# to work. The TLS backend is left alone: the default `tls` feature is
# webpki-roots (the bundled Mozilla set), and `native-tls` would drag OpenSSL
# into a static musl build.
ureq = { version = "2.12", features = ["proxy-from-env"] }
# Step 4 of #65: verify a release tarball's minisign signature offline, then
# open it. All three are pure Rust — the musl targets need no C toolchain for
# them (ring, which ureq brings, is the one that does, and dist installs
# musl-tools on the release runners for it).
minisign-verify = "0.2"
lzma-rs = "0.3"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
# Generates a keypair and signs inside the tests, so no secret key is ever
# committed. Same author and format as the C minisign the release uses.
minisign = "0.9"

[profile.release]
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# The package exists to do the one thing a tarball cannot: install dtach. Of
# roost's four Linux install paths only Homebrew declares it today, and
# Linuxbrew is a rounding error on Linux — so every realistic Linux install
# currently leaves the dependency unmet until a terminal fails to spawn.
[package.metadata.deb]
depends = "dtach"
section = "utils"
priority = "optional"
assets = [
    ["target/release/roost", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/roost/README.md", "644"],
    ["LICENSE-MIT", "usr/share/doc/roost/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/roost/LICENSE-APACHE", "644"],
    ["packaging/roost.service", "usr/lib/systemd/user/roost.service", "644"],
]
maintainer-scripts = "packaging/debian/"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/roost", dest = "/usr/bin/roost", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/roost/README.md", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/doc/roost/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/doc/roost/LICENSE-APACHE", mode = "644" },
    { source = "packaging/roost.service", dest = "/usr/lib/systemd/user/roost.service", mode = "644" },
]

[package.metadata.generate-rpm.requires]
dtach = "*"
