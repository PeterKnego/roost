[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
#
# Linux is musl, not gnu, and that is load-bearing rather than a preference.
# The hand-built v0.5.0 gnu binary requires GLIBC_2.39 and fails at *load*
# time on Debian 12 (2.36), Ubuntu 22.04 (2.35) and Amazon Linux 2023 (2.34)
# — roost runs on servers, which are routinely older than the runner. The
# whole gap is two weak symbols from std's posix_spawn pidfd path, but
# .gnu.version_r carries no VER_FLG_WEAK for them, so the loader treats the
# missing version as fatal. A static musl build removes the question.
# No Windows: roost spawns dtach.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Per-artifact checksums, and GitHub's provenance attestation so a downloaded
# binary can be traced to this workflow with `gh attestation verify`.
checksum = "sha256"
github-attestations = true

# The tap dist pushes the generated formula to on each tagged release. This is
# the *repository* name, and Homebrew requires the `homebrew-` prefix on it
# (tap.rb: `full_repository = "homebrew-#{repository}"`), so the repository
# `homebrew-roost` is the tap `peterknego/roost` and the install command is
# `brew install peterknego/roost/roost`. There is no shorthand that collapses
# the repeat — a tap named after its one formula still names the formula.
#
# Lower case deliberately, and it is not merely cosmetic: Homebrew downcases a
# tap name (`tap.rb`: `@name = "#{user}/#{repository}".downcase`) and GitHub
# resolves the path case-insensitively, so this and `PeterKnego/...` are the
# same repository and the same tap. Written the way a user types it.
#
# The repository must already exist and the publishing token must have write
# access to it, or the publish job fails after every artifact has been built.
#
# Namespaced on purpose: `navbytes/roost` ships a binary of the same name from
# its own tap, so a user who has tapped both must install by the fully
# qualified name. See handover 6.1 — the collision is permanent and known.
tap = "peterknego/homebrew-roost"
publish-jobs = ["homebrew"]

# dtach is a *runtime* prerequisite, not a build one — roost spawns it, it is
# not linked against. `stage = ["run"]` is what turns this into a `depends_on`
# in the formula rather than a `brew install` on the build runner. This is the
# one thing a tarball or a shell installer cannot do for the user, and the
# reason Homebrew is the primary macOS channel rather than merely the popular
# one.
[dist.dependencies.homebrew]
dtach = { stage = ["run"] }
