[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
#
# Linux is musl, not gnu, and that is load-bearing rather than a preference.
# The hand-built v0.5.0 gnu binary requires GLIBC_2.39 and fails at *load*
# time on Debian 12 (2.36), Ubuntu 22.04 (2.35) and Amazon Linux 2023 (2.34)
# — roost runs on servers, which are routinely older than the runner. The
# whole gap is two weak symbols from std's posix_spawn pidfd path, but
# .gnu.version_r carries no VER_FLG_WEAK for them, so the loader treats the
# missing version as fatal. A static musl build removes the question.
# No Windows: roost spawns dtach.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# Per-artifact checksums, and GitHub's provenance attestation so a downloaded
# binary can be traced to this workflow with `gh attestation verify`.
checksum = "sha256"
github-attestations = true

# The tap dist pushes the generated formula to on each tagged release. This is
# the *repository* name; Homebrew requires the `homebrew-` prefix on it
# (tap.rb: `full_repository = "homebrew-#{repository}"`), so this repository is
# the tap `peterknego/tap` and the command is `brew install peterknego/tap/roost`.
#
# A tap named for the formula — `homebrew-roost`, giving
# `peterknego/roost/roost` — was tried and reverted. Homebrew has no shorthand
# collapsing a tap onto a same-named formula, so the repeat buys nothing, and a
# per-formula tap is a dead end: every future binary in this account would need
# its own repository and its own `brew tap` from the user, where one tap carries
# them all to anyone who has already tapped it.
#
# Lower case deliberately, and not merely cosmetic: Homebrew downcases a tap
# name (`tap.rb`: `@name = "#{user}/#{repository}".downcase`) and GitHub resolves
# the path case-insensitively, so this and `PeterKnego/...` are the same
# repository and the same tap. Written the way a user types it.
#
# The repository must already exist and the publishing token must have write
# access to it, or the publish job fails after every artifact has been built.
#
# Namespaced on purpose: `navbytes/roost` ships a binary of the same name from
# its own tap, so a user who has tapped both must install by the fully
# qualified name. See handover 6.1 — the collision is permanent and known.
tap = "peterknego/homebrew-tap"
publish-jobs = ["homebrew", "./publish-crates-io"]

# release.yml is hand-edited, so dist must stop checking it against its own
# generator — without this, `dist plan` fails every CI run with "has out of date
# contents".
#
# The single edit is `environment: release` on `publish-homebrew-formula`.
# HOMEBREW_TAP_TOKEN is an environment secret rather than a repo secret,
# because a repo secret is readable by any workflow file on any ref and a
# pull_request run from a same-repo branch supplies its own copies — so the
# token was reachable from any branch pushed here. dist 0.32 has no config key
# for a job environment (`github-custom-job-permissions` covers permissions
# only), and GitHub offers no way to attach an environment to a job from
# outside the workflow file, so editing the generated file is the only route.
# The crates.io job needs no exemption: it is a *custom* publish job living in
# its own file, which dist does not police.
#
# THE COST, since it is silent: dist no longer regenerates or verifies
# release.yml, so a change to `targets`, `installers`, or anything else here
# will not reach the workflow and nothing will say so. On a dist upgrade:
# remove this key, run `dist init`, re-add `environment: release` to
# publish-homebrew-formula, then restore this key.
allow-dirty = ["ci"]

# dist's default grant for a custom publish job is `{id-token, packages}`, and
# permissions can only be reduced going down a reusable-workflow chain, never
# elevated — so the callee's `contents: read` (needed for actions/checkout and
# for `cargo publish` to read the crate) made GitHub reject the whole release
# workflow at startup rather than just fail the job. Overriding this key
# *replaces* dist's defaults rather than adding to them, so `id-token` has to
# be restated here too; `packages` is dropped since nothing in this job
# publishes a container or npm package.
github-custom-job-permissions = { "publish-crates-io" = { "id-token" = "write", "contents" = "read" } }

# Runs in the global phase, not the local one: the local phase is a matrix, so
# a job there sees one target's output. The global phase is the first point at
# which all four binaries exist and can be downloaded.
global-artifacts-jobs = ["./build-linux-packages"]

# dtach is a *runtime* prerequisite, not a build one — roost spawns it, it is
# not linked against. `stage = ["run"]` is what turns this into a `depends_on`
# in the formula rather than a `brew install` on the build runner. This is the
# one thing a tarball or a shell installer cannot do for the user, and the
# reason Homebrew is the primary macOS channel rather than merely the popular
# one.
[dist.dependencies.homebrew]
dtach = { stage = ["run"] }
